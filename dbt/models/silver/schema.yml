version: 2
models:
  - name: silver_payment_events
    description: Deduplicated payment webhooks. One row per webhook event id.
    columns:
      - name: webhook_event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values: {arguments: {values: ['charge.succeeded', 'charge.refunded']}}
  - name: silver_participants
    columns:
      - name: participant_id
        tests: [unique, not_null]
  - name: silver_registrations
    columns:
      - name: registration_id
        tests: [unique, not_null]
